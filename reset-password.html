<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password - Sewon Survey System</title>
  <link rel="icon" href="adminicon.ico" type="image/x-icon">
  <style>
    :root{
      --bg1:#1a5a66;
      --bg2:#cfd8dc;
      --card:#ffffff;
      --text:#0f172a;
      --brand:#1d4ed8;
      --danger:#dc2626;
      --ok:#16a34a;
      --radius:18px;
      --shadow:0 20px 40px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        linear-gradient(135deg, rgba(16,101,113,.88), rgba(207,216,220,.90)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 120px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, transparent 1px 160px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(520px,100%);
      background:#fff;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.55);
      overflow:hidden;
    }
    .head{padding:24px 28px 14px; text-align:center;}
    .title{font-weight:900; letter-spacing:.16em; color:var(--brand); font-size:14px;}
    .hr{margin-top:14px; height:1px; background:rgba(15,23,42,.08);}
    .body{padding:18px 28px 24px;}
    .row{display:grid; gap:10px; margin:12px 0;}
    .label{font-size:13px; font-weight:800; color:rgba(15,23,42,.75);}
    .inp{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(15,23,42,.16);
      outline:none;
      font-size:14px;
      background:#fff;
      color:var(--text);
    }
    .inp:focus{border-color:rgba(29,78,216,.55); box-shadow:0 0 0 3px rgba(29,78,216,.18);}
    .btn{
      width:100%;
      border:0;
      border-radius:999px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
    }
    .btn.primary{background:#111;color:#fff;}
    .btn.primary:hover{filter:brightness(1.05);}
    .btn.secondary{
      background:transparent;
      border:1px solid rgba(15,23,42,.16);
      color:rgba(15,23,42,.85);
      margin-top:10px;
    }
    .btn:disabled{opacity:.55;cursor:not-allowed;}
    .msg{margin-top:12px;font-size:13px;font-weight:800;}
    .msg.err{color:var(--danger);}
    .msg.ok{color:var(--ok);}
    .note{
      margin-top:14px;
      padding:12px;
      border:1px solid rgba(15,23,42,.10);
      border-radius:12px;
      background:rgba(15,23,42,.03);
      color:rgba(15,23,42,.65);
      font-weight:700;
      font-size:12px;
      line-height:1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="title">RESET PASSWORD</div>
      <div class="hr"></div>
    </div>
    <div class="body">
      <div class="row">
        <div class="label">새 비밀번호</div>
        <input class="inp" id="pw1" type="password" autocomplete="new-password" placeholder="새 비밀번호를 입력하세요">
      </div>
      <div class="row">
        <div class="label">새 비밀번호 확인</div>
        <input class="inp" id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력하세요">
      </div>
      <button class="btn primary" id="btnChange" type="button">비밀번호 변경하기</button>
      <button class="btn secondary" id="btnBack" type="button">로그인 페이지로 이동</button>
      <div id="msg" class="msg"></div>
      <div class="note">
        이 페이지는 비밀번호 재설정 링크로 들어왔을 때만 정상 동작합니다.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pztlmyfutfmbmlvavwuz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fnGFEvCmhZRRIWj0qrEEeA_Vex3mxac";
    const LOGIN_PAGE_URL = "./index.html";

    const $ = (id) => document.getElementById(id);

    function setMsg(text, type){
      const el = $('msg');
      el.textContent = text || '';
      el.className = 'msg' + (type ? ' ' + type : '');
    }

    function normalizeMessage(error){
      const raw = (error?.message || String(error || '')).trim();
      const lower = raw.toLowerCase();
      if(lower.includes('same password')) return '기존 비밀번호와 다른 비밀번호를 입력해 주세요.';
      if(lower.includes('weak password')) return '더 안전한 비밀번호를 입력해 주세요.';
      if(lower.includes('expired')) return '재설정 링크가 만료되었습니다. 다시 비밀번호 찾기를 진행해 주세요.';
      return raw || '처리 중 오류가 발생했습니다.';
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if(!window.supabase){
        setMsg('Supabase 라이브러리를 불러오지 못했습니다.', 'err');
        return;
      }

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: window.localStorage,
          storageKey: 'sb-pztlmyfutfmbmlvavwuz-auth-token',
        },
      });

      $('btnBack').onclick = async () => {
        try { await sb.auth.signOut(); } catch(_) {}
        window.location.href = LOGIN_PAGE_URL;
      };

      let recoveryReady = false;

      const markRecoveryReady = () => {
        recoveryReady = true;
        setMsg('새 비밀번호를 입력한 뒤 변경 버튼을 눌러주세요.', 'ok');
      };

      if ((window.location.hash || '').includes('type=recovery') || (window.location.search || '').includes('type=recovery')) {
        markRecoveryReady();
      }

      const { data: s1 } = await sb.auth.getSession();
      if (s1.session && s1.session.user) {
        recoveryReady = true;
      }

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          markRecoveryReady();
          return;
        }
        if ((window.location.hash || '').includes('type=recovery') || (window.location.search || '').includes('type=recovery')) {
          markRecoveryReady();
          return;
        }
        if (session && session.user) {
          recoveryReady = true;
        }
      });

      $('btnChange').onclick = async () => {
        setMsg('', '');
        const pw1 = $('pw1').value || '';
        const pw2 = $('pw2').value || '';

        if(!pw1 || !pw2){
          setMsg('새 비밀번호와 확인 비밀번호를 모두 입력하세요.', 'err');
          return;
        }
        if(pw1 !== pw2){
          setMsg('비밀번호 확인이 일치하지 않습니다.', 'err');
          return;
        }
        if(pw1.length < 8){
          setMsg('비밀번호는 8자 이상으로 입력해 주세요.', 'err');
          return;
        }
        if(!recoveryReady){
          setMsg('유효한 비밀번호 재설정 링크가 아닙니다. 로그인 페이지에서 다시 비밀번호 찾기를 진행해 주세요.', 'err');
          return;
        }

        $('btnChange').disabled = true;
        try{
          const { error } = await sb.auth.updateUser({ password: pw1 });
          if(error){
            setMsg(normalizeMessage(error), 'err');
            return;
          }

          setMsg('비밀번호가 변경되었습니다. 로그인 페이지로 이동합니다.', 'ok');
          setTimeout(async () => {
            try { await sb.auth.signOut(); } catch(_) {}
            window.location.href = LOGIN_PAGE_URL;
          }, 1200);
        } finally {
          $('btnChange').disabled = false;
        }
      };
    });
  </script>
</body>
</html>
